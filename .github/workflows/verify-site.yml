name: Verify site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: false
          verbose: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated site
        run: python3 scripts/verify_site.py --source . --site _site
