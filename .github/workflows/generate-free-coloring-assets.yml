name: Generate free coloring assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_free_coloring_assets.py'
      - '.github/workflows/generate-free-coloring-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate downloadable assets
        run: python scripts/generate_free_coloring_assets.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/free-capybara-astronaut-preview.webp assets/downloads/free-capybara-astronaut-us-letter.pdf assets/downloads/free-capybara-astronaut-a4.pdf
          if git diff --cached --quiet; then
            echo 'Generated assets are already current.'
            exit 0
          fi
          git commit -m 'Generate free coloring page download assets'
          git push
